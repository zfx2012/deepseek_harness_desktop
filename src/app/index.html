<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
  <title>DeepSeek Harness Desktop</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0f1115; color: #d7dbe2;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .card { text-align: center; max-width: 560px; padding: 40px; }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 16px;
      background: linear-gradient(135deg, #4f6ef7, #8a5cf6);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 26px; color: #fff; letter-spacing: 1px;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 13px; color: #8b93a3; line-height: 1.6; }
    .spinner {
      width: 28px; height: 28px; margin: 22px auto;
      border: 3px solid #262b36; border-top-color: #4f6ef7; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
    button {
      margin-top: 20px; padding: 9px 22px; border: 0; border-radius: 8px;
      background: #4f6ef7; color: #fff; font-size: 13px; cursor: pointer;
    }
    button.secondary { background: #262b36; color: #c6cbd6; margin-left: 10px; }
    pre {
      margin-top: 18px; padding: 12px; border-radius: 8px; background: #161a22;
      text-align: left; font-size: 11px; color: #98a0b3;
      max-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3f8f4f; margin-right: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">DSH</div>
    <div id="loading">
      <h1>正在启动 DeepSeek Harness 服务器…</h1>
      <p id="loading-hint">首次启动需要组合配置与加载插件，请稍候。</p>
      <div class="spinner"></div>
    </div>
    <div id="error" class="hidden">
      <h1>服务器启动失败</h1>
      <p id="error-msg"></p>
      <pre id="error-log"></pre>
      <div>
        <button id="retry">重试</button>
        <button id="settings" class="secondary">打开设置</button>
      </div>
    </div>
    <div id="stopped" class="hidden">
      <h1>服务器已停止</h1>
      <p>通过菜单或托盘重新启动服务器。</p>
      <div>
        <button id="start">启动服务器</button>
        <button id="settings-stopped" class="secondary">打开设置</button>
      </div>
    </div>
  </div>
  <script src="shell.js"></script>
</body>
</html>
