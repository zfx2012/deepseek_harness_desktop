name: build-desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install desktop deps
        run: pnpm install --ignore-scripts
      - name: Restore Electron binary
        shell: pwsh
        run: |
          node node_modules/electron/install.js
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # The 280MB harness closure is cached. On a miss the official
      # deepseek-harness repo is checked out and built from source (public
      # repo, zero configuration); bump the cache key when the official repo
      # version changes (or let the 7-day cache eviction rebuild it).
      - name: Restore bundled harness (cache)
        id: harness-cache
        uses: actions/cache@v4
        with:
          path: harness-deploy
          key: harness-bundle-0.1.0-rc.5-v1

      - name: Checkout official harness (cache miss)
        if: steps.harness-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: harness-checkout

      - name: Install official harness deps (cache miss)
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
        working-directory: harness-checkout

      - name: Build official harness (cache miss)
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: pnpm run build
        working-directory: harness-checkout

      - name: Bundle harness closure (cache miss)
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: node scripts/bundle-harness.mjs --force --harness harness-checkout

      # Full verification: unit tests -> bundle validation -> package ->
      # bundled smoke (must use resources/harness) -> error-path smoke ->
      # no-node smoke (ELECTRON_RUN_AS_NODE fallback).
      - name: Verify (tests + package + smoke suite)
        shell: pwsh
        run: pwsh scripts/verify.ps1
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Build installers (NSIS + portable)
        run: npm run dist
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
